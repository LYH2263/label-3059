version: '3.8'
services:
  orange-backend:
    build:
      context: ./backend
    container_name: orange-backend
    # No ports exposed publicly, only internal to the network
    expose:
      - "5000"
    volumes:
      - ./backend/data:/app/data
    restart: always
    environment:
      - PORT=5000
      - JWT_SECRET=orange-secret-key-123
      - NODE_ENV=production

  orange-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orange-frontend
    ports:
      - "3059:80"
    depends_on:
      - orange-backend
    restart: always
